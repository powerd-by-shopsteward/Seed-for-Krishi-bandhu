<style>
:root{--g:#16a34a;--gd:#15803d;--gl:#f0fdf4;--r:#dc2626;--rl:#fef2f2;--b:#2563eb;--bg:#f8fafc;--sf:#fff;--bd:#e2e8f0;--tx:#0f172a;--mu:#64748b;--rad:12px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--tx);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:var(--gd);text-decoration:none}button{font:inherit;cursor:pointer}input,select,textarea{font:inherit}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 16px;border-radius:10px;border:0;font-weight:500;font-size:13px;transition:.15s;white-space:nowrap}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-primary{background:var(--g);color:#fff}.btn-primary:hover:not(:disabled){background:var(--gd)}
.btn-secondary{background:#f1f5f9;color:var(--tx)}.btn-secondary:hover:not(:disabled){background:#e2e8f0}
.btn-danger{background:var(--rl);color:var(--r)}
.btn-sm{padding:6px 12px;font-size:12px}.btn-block{width:100%}
.input{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--bd);background:#fff;font-size:14px;outline:none;transition:.15s}
.input:focus{border-color:var(--g);box-shadow:0 0 0 3px rgba(22,163,74,.1)}
.label{display:block;font-size:12px;font-weight:500;color:var(--mu);margin-bottom:6px}
.card{background:var(--sf);border-radius:var(--rad);border:1px solid var(--bd);padding:20px}
.layout{display:flex;min-height:100vh}
.sidebar{width:240px;background:var(--sf);border-right:1px solid var(--bd);padding:20px 16px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px;margin-bottom:24px;cursor:pointer;color:inherit}
.brand-logo{width:40px;height:40px;border-radius:10px;background:var(--gl);display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;overflow:hidden}
.brand-logo img{width:100%;height:100%;object-fit:cover}
.brand-text{font-weight:700;font-size:15px;color:var(--gd);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav{flex:1;display:flex;flex-direction:column;gap:4px}
.nav a{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;color:var(--mu);font-size:14px;font-weight:500;transition:.15s}
.nav a:hover{background:var(--bg);color:var(--tx)}
.nav a.active{background:var(--gl);color:var(--gd)}
.sidebar-footer{border-top:1px solid var(--bd);padding-top:12px;display:flex;flex-direction:column;gap:4px}
.main{flex:1;padding:24px;max-width:1200px;width:100%;margin:0 auto}
.page-header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.page-header h1{font-size:22px;font-weight:700}.page-header p{color:var(--mu);font-size:13px;margin-top:4px}
.page-actions{display:flex;gap:8px;flex-wrap:wrap}
.mobile-header{display:none;padding:12px 16px;background:var(--sf);border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:20;align-items:center;gap:10px}
.mobile-nav{display:none;position:fixed;bottom:0;left:0;right:0;background:var(--sf);border-top:1px solid var(--bd);z-index:30;padding:6px 0}
.mobile-nav a{flex:1;text-align:center;font-size:10px;color:var(--mu);padding:6px 4px;font-weight:500}

.stat-card{background:var(--sf);border:1px solid var(--bd);border-radius:var(--rad);padding:16px}
.stat-label{font-size:11px;color:var(--mu);text-transform:uppercase;letter-spacing:.5px;font-weight:600}
.stat-value{font-size:22px;font-weight:700;margin-top:6px}
.stat-value.green{color:var(--gd)}.stat-value.red{color:var(--r)}.stat-value.blue{color:var(--b)}
.stat-sub{font-size:11px;color:var(--mu);margin-top:4px}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:12px;font-weight:600;color:var(--mu);padding:10px 12px;border-bottom:1px solid var(--bd);text-transform:uppercase;letter-spacing:.3px}
td{padding:12px;border-bottom:1px solid var(--bd);font-size:13px}
tr:last-child td{border-bottom:none}tr:hover td{background:var(--bg)}
.text-right{text-align:right}
.modal-overlay{position:fixed;inset:0;background:rgba(15,23,42,.5);display:flex;align-items:center;justify-content:center;padding:16px;z-index:100}
.modal{background:#fff;border-radius:14px;padding:24px;max-width:560px;width:100%;max-height:90vh;overflow-y:auto}
.modal h2{font-size:18px;font-weight:700;margin-bottom:16px}
.form-row{margin-bottom:14px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
#toast-root{position:fixed;bottom:20px;right:20px;z-index:200;display:flex;flex-direction:column;gap:8px}
.toast{background:var(--tx);color:#fff;padding:12px 16px;border-radius:10px;font-size:13px;animation:slideIn .2s;max-width:340px}
.toast-success{background:var(--g)}.toast-error{background:var(--r)}
@keyframes slideIn{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}
.login-page{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;background:linear-gradient(135deg,#f0fdf4,#dcfce7)}

.badge{display:inline-block;padding:2px 8px;border-radius:999px;font-size:10px;font-weight:600}
.badge-green{background:var(--gl);color:var(--gd)}.badge-red{background:var(--rl);color:var(--r)}.badge-gray{background:#f1f5f9;color:var(--mu)}

  .main{padding:16px;padding-bottom:90px}.form-grid{grid-template-columns:1fr}.page-header h1{font-size:20px}

  @page{margin:12mm}
  body *{visibility:hidden}

<body>
<div id="app"></div>
<div id="modal-root"></div>
<div id="toast-root"></div>
<script>
/* ============================================================
   SEED SHOP MANAGER
   ============================================================ */
const SUPABASE_URL = 'https://sscejmaostawltqngdfa.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_sxkp6in2tgXHTP54xfJbGA_-ghEUWUD';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
  auth:{ autoRefreshToken:true, persistSession:true, detectSessionInUrl:true }
});

const DB = { products:[], prices:[], customers:[], payments:[], invoices:[], invoice_items:[], suppliers:[], supplier_bills:[], supplier_payments:[] };
let SETTINGS = { shop_name:'Seed Shop', owner_name:'', address:'', phone:'', license:'', upi:'', logo:'' };
let SESSION = null;

/* ---------- HELPERS ---------- */
const $ = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>[...r.querySelectorAll(s)];
const todayStr = () => { const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtNum = n => { const v = Number(n||0); return v%1===0 ? String(v) : v.toFixed(2); };
const fmtDate = d => { if(!d) return '-'; return new Date(String(d).slice(0,10)).toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'}); };
function inr(n){
  const num = Number(n||0); const neg = num<0; const s = Math.abs(num).toFixed(2);
  const p = s.split('.'); let i = p[0];
  if(i.length>3){ const l3=i.slice(-3), r=i.slice(0,-3); i=r.replace(/\B(?=(\d{2})+(?!\d))/g,',')+','+l3; }
  return (neg?'-':'')+i+'.'+p[1];
}
const rs = n => '₹'+inr(n);
function toast(msg,type='info'){
  const el = document.createElement('div'); el.className='toast toast-'+type; el.textContent=msg;
  $('#toast-root').appendChild(el); setTimeout(()=>el.remove(),3500);
}
function openModal(html,onMount){
  $('#modal-root').innerHTML = `<div class="modal-overlay"><div class="modal">${html}</div></div>`;
  $('#modal-root .modal-overlay').addEventListener('click',e=>{ if(e.target.classList.contains('modal-overlay')) closeModal(); });
  if(onMount) onMount($('#modal-root'));
}
function closeModal(){ $('#modal-root').innerHTML=''; }
window.closeModal = closeModal;

/* ---------- PRICE RESOLUTION (CORE LOGIC) ---------- */
/**
 * Resolves the price record active on targetDate.
 * Rule: most recent effective_date <= targetDate.
 * Fallback ("first sale always old date stock"): if none exists, use the OLDEST record.
 */
function resolvePrice(productId, targetDate){
  const relevant = DB.prices.filter(p => p.product_id === productId);
  if(relevant.length === 0) return null;
  // sort: effective_date desc, then created_at desc
  const desc = [...relevant].sort((a,b)=>{
    if(a.effective_date !== b.effective_date) return b.effective_date.localeCompare(a.effective_date);
    return String(b.created_at||'').localeCompare(String(a.created_at||''));
  });
  for(const p of desc){ if(p.effective_date <= targetDate) return p; }
  // fallback → oldest
  return [...relevant].sort((a,b)=>a.effective_date.localeCompare(b.effective_date))[0];
}

/* ---------- DATA SYNC ---------- */
async function syncDB(){
  try{
    const [p,pr,c,pay,i,it,su,sb_,sp,st] = await Promise.all([
      sb.from('seeds_products').select('*').order('name'),
      sb.from('seeds_prices').select('*').order('effective_date',{ascending:false}),
      sb.from('seeds_customers').select('*').order('name'),
      sb.from('seeds_payments').select('*'),
      sb.from('seeds_invoices').select('*').order('invoice_date',{ascending:false}),
      sb.from('seeds_invoice_items').select('*'),
      sb.from('seeds_suppliers').select('*').order('name'),
      sb.from('seeds_supplier_bills').select('*').order('bill_date',{ascending:false}),
      sb.from('seeds_supplier_payments').select('*'),
      sb.from('seeds_settings').select('*').eq('id',1).maybeSingle()
    ]);
    DB.products = p.data||[]; DB.prices = pr.data||[]; DB.customers = c.data||[];
    DB.payments = pay.data||[]; DB.invoices = i.data||[]; DB.invoice_items = it.data||[];
    DB.suppliers = su.data||[]; DB.supplier_bills = sb_.data||[]; DB.supplier_payments = sp.data||[];
    if(st.data) SETTINGS = {...SETTINGS, ...st.data};
  }catch(e){ toast('Load failed: '+e.message,'error'); }
}
async function saveSettings(){
  const { error } = await sb.from('seeds_settings').upsert({
    id:1, shop_name:SETTINGS.shop_name, owner_name:SETTINGS.owner_name,
    address:SETTINGS.address, phone:SETTINGS.phone, license:SETTINGS.license,
    upi:SETTINGS.upi, logo:SETTINGS.logo, updated_at:new Date().toISOString()
  });
  if(error){ toast('Save failed: '+error.message,'error'); return false; }
  return true;
}

/* ---------- AUTH ---------- */
async function initAuth(){
  const { data:{session} } = await sb.auth.getSession();
  SESSION = session;
  sb.auth.onAuthStateChange((event,s)=>{
    SESSION = s;
    if(event==='SIGNED_OUT'){ location.hash='#/'; renderLogin(); }
  });
}
async function login(email,password){
  const { error } = await sb.auth.signInWithPassword({ email, password });
  if(error) throw error;
  const { data:{session} } = await sb.auth.getSession();
  SESSION = session;
}
async function logout(){ await sb.auth.signOut(); SESSION=null; location.hash='#/'; route(); }

/* ---------- LOGIN ---------- */
function renderLogin(){
  $('#app').innerHTML = `
    <div class="login-page">
      <form id="login-form" class="login-box">
        <h1>${esc(SETTINGS.shop_name||'Seed Shop')}</h1>
        <p>Owner sign in</p>
        <div class="form-row"><label class="label">Email</label><input class="input" type="email" id="l-email" required autocomplete="username"></div>
        <div class="form-row"><label class="label">Password</label><input class="input" type="password" id="l-pwd" required autocomplete="current-password"></div>
        <div id="l-err" style="color:var(--r);font-size:12px;display:none;margin-bottom:12px"></div>
        <button class="btn btn-primary btn-block" type="submit" id="l-btn">Sign in</button>
      </form>
    </div>`;
  $('#login-form').onsubmit = async e=>{
    e.preventDefault();
    const errEl = $('#l-err'); errEl.style.display='none';
    const btn = $('#l-btn'); btn.disabled=true; btn.textContent='Signing in...';
    try{
      await login($('#l-email').value.trim(), $('#l-pwd').value);
      await syncDB();
      await route();
    }catch(err){
      errEl.textContent = err.message; errEl.style.display='block';
      btn.disabled=false; btn.textContent='Sign in';
    }
  };
}

/* ---------- LAYOUT ---------- */
const NAV = [
  ['#/','📊','Dashboard'],
  ['#/customers','👥','Customers'],
  ['#/invoices','📄','Invoices'],
  ['#/reports','📈','Reports']
];
function renderLayout(){
  const hash = location.hash||'#/';
  const navHTML = NAV.map(([h,i,l])=>{
    const a = hash===h || (h!=='#/' && hash.startsWith(h)) ? 'active' : '';
    return `<a href="${h}" class="${a}"><span style="font-size:16px">${i}</span>${l}</a>`;
  }).join('');
  const mnavHTML = NAV.map(([h,i,l])=>{
    const a = hash===h || (h!=='#/' && hash.startsWith(h)) ? 'active' : '';
    return `<a href="${h}" class="${a}"><span>${i}</span>${l}</a>`;
  }).join('');
  $('#app').innerHTML = `
    <div class="layout">
      <aside class="sidebar">
        <a href="#/profile" class="brand">
          <div class="brand-logo">${SETTINGS.logo?`<img src="${SETTINGS.logo}">`:'🌱'}</div>
          <div class="brand-text">${esc(SETTINGS.shop_name||'Seed Shop')}</div>
        </a>
        <nav class="nav">${navHTML}</nav>
        <div class="sidebar-footer">
          <a href="#/products" class="btn btn-secondary" style="justify-content:flex-start">📦 Products</a>
          <a href="#/suppliers" class="btn btn-secondary" style="justify-content:flex-start">🚚 Suppliers</a>
          <a href="#/profile" class="btn btn-secondary" style="justify-content:flex-start">⚙️ Shop Profile</a>
          <button id="btn-logout" class="btn btn-secondary" style="justify-content:flex-start;color:var(--r)">↪ Sign out</button>
        </div>
      </aside>
      <div style="flex:1">
        <header class="mobile-header">
          <a href="#/profile" class="brand-logo" style="width:32px;height:32px;font-size:18px">${SETTINGS.logo?`<img src="${SETTINGS.logo}">`:'🌱'}</a>
          <div style="font-weight:700;color:var(--gd)">${esc(SETTINGS.shop_name||'Seed Shop')}</div>
        </header>
        <main id="content" class="main"></main>
      </div>
    </div>
    <nav class="mobile-nav">${mnavHTML}</nav>`;
  $('#btn-logout').onclick = logout;
}

/* ---------- CUSTOMER DUE CALC ---------- */
function customerDue(customerId){
  const inv = DB.invoices.filter(i=>i.customer_id===customerId).reduce((s,i)=>s+Number(i.due),0);
  const pay = DB.payments.filter(p=>p.customer_id===customerId).reduce((s,p)=>s+Number(p.amount),0);
  return inv - pay;
}
function totalCustomerDue(){
  return DB.invoices.reduce((s,i)=>s+Number(i.due),0) - DB.payments.reduce((s,p)=>s+Number(p.amount),0);
}

/* ---------- SUPPLIER DUE CALC ---------- */
function supplierDue(supplierId){
  const sup = DB.suppliers.find(s=>s.id===supplierId);
  const open = Number(sup?.opening_balance||0);
  const bills = DB.supplier_bills.filter(b=>b.supplier_id===supplierId);
  const billTotal = bills.reduce((s,b)=>s+Number(b.total),0);
  const billPaid = bills.reduce((s,b)=>s+Number(b.paid),0);
  const extraPaid = DB.supplier_payments.filter(p=>p.supplier_id===supplierId).reduce((s,p)=>s+Number(p.amount),0);
  return open + billTotal - billPaid - extraPaid;
}

/* ---------- DASHBOARD ---------- */
function renderDashboard(content){
  const today = todayStr();
  const todayInvs = DB.invoices.filter(i=>i.invoice_date===today);
  const todaySales = todayInvs.reduce((s,i)=>s+Number(i.total),0);
  const todayDue = todayInvs.reduce((s,i)=>s+Number(i.due),0);
  const totalDue = totalCustomerDue();
  let stockValue = 0;
  DB.products.forEach(p=>{
    const pr = resolvePrice(p.id, today);
    if(pr) stockValue += Number(p.stock)*Number(pr.cost_price_base||0);
  });
  const lowStock = DB.products.filter(p=>Number(p.stock)<=Number(p.low_stock_alert));
  const recentInvs = DB.invoices.slice(0,5);

  content.innerHTML = `
    <div class="page-header">
      <div><h1>Dashboard</h1><p>Welcome back${SETTINGS.owner_name?', '+esc(SETTINGS.owner_name):''}</p></div>
      <div class="page-actions"><a href="#/invoice/new" class="btn btn-primary">+ New Invoice</a></div>
    </div>
    <div class="stats-grid">
      <div class="stat-card"><div class="stat-label">Today's Sales</div><div class="stat-value green">${rs(todaySales)}</div><div class="stat-sub">${todayInvs.length} invoices</div></div>
      <div class="stat-card"><div class="stat-label">Today's Due</div><div class="stat-value red">${rs(todayDue)}</div></div>
      <div class="stat-card"><div class="stat-label">Stock Value (Cost)</div><div class="stat-value blue">${rs(stockValue)}</div><div class="stat-sub">${DB.products.length} products</div></div>
      <div class="stat-card"><div class="stat-label">Total Customer Due</div><div class="stat-value red">${rs(totalDue)}</div></div>
    </div>
    <div class="card" style="margin-bottom:16px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
        <h2 style="font-size:16px;font-weight:700">Products</h2>
        <a href="#/products" class="btn btn-secondary btn-sm">Manage →</a>
      </div>
      <div style="display:flex;gap:24px;flex-wrap:wrap">
        <div><div style="font-size:11px;color:var(--mu);text-transform:uppercase;font-weight:600">Total</div><div style="font-size:20px;font-weight:700">${DB.products.length}</div></div>
        <div><div style="font-size:11px;color:var(--mu);text-transform:uppercase;font-weight:600">Low Stock</div><div style="font-size:20px;font-weight:700;color:var(--r)">${lowStock.length}</div></div>
      </div>
      ${lowStock.length>0?`<div style="margin-top:12px;padding-top:12px;border-top:1px solid var(--bd)">
        <div style="font-size:12px;font-weight:600;color:var(--mu);margin-bottom:8px">LOW STOCK</div>
        ${lowStock.slice(0,5).map(p=>`<div style="display:flex;justify-content:space-between;padding:6px 0;font-size:13px"><span>${esc(p.name)}</span><span style="color:var(--r);font-weight:600">${fmtNum(p.stock)} ${esc(p.base_unit)}</span></div>`).join('')}
      </div>`:''}
    </div>
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
        <h2 style="font-size:16px;font-weight:700">Recent Invoices</h2>
        <a href="#/invoices" class="btn btn-secondary btn-sm">View all →</a>
      </div>
      ${recentInvs.length===0?'<div class="empty">No invoices yet</div>':`
        <div class="table-wrap"><table>
          <thead><tr><th>Invoice</th><th>Customer</th><th>Date</th><th class="text-right">Total</th><th class="text-right">Due</th></tr></thead>
          <tbody>${recentInvs.map(i=>{
            const c = DB.customers.find(x=>x.id===i.customer_id);
            return `<tr style="cursor:pointer" onclick="location.hash='#/invoice/${i.id}'">
              <td style="font-weight:500">${esc(i.invoice_no)}</td>
              <td>${esc(c?.name||'Walk-in')}</td>
              <td>${fmtDate(i.invoice_date)}</td>
              <td class="text-right">${rs(i.total)}</td>
              <td class="text-right" style="color:${Number(i.due)>0?'var(--r)':'var(--mu)'}">${rs(i.due)}</td>
            </tr>`;
          }).join('')}</tbody>
        </table></div>`}
    </div>`;
}

/* ---------- CUSTOMERS ---------- */
function renderCustomers(content){
  content.innerHTML = `
    <div class="page-header">
      <div><h1>Customers</h1><p>Customer list and dues</p></div>
      <div class="page-actions"><button id="add-cust" class="btn btn-primary">+ Add Customer</button></div>
    </div>

function openCustomerForm(existing){

    <form id="cust-form">
      <div class="form-row"><label class="label">Name *</label><input class="input" name="name" required value="${esc(c.name)}" autofocus></div>

    root.querySelector('#cust-form').onsubmit = async e=>{
      e.preventDefault();

// 2. UPDATED: Add Stock & Price together (Now records the quantity)
function openNewBatchForm(p){
  const today = todayStr();
  const current = resolvePrice(p.id, today);
  
  openModal(`
    <h2>Add New Batch — ${esc(p.name)}</h2>
    <p style="font-size:13px;color:var(--mu);margin-bottom:14px">Current Stock: <b>${fmtNum(p.stock)} ${esc(p.base_unit)}</b></p>
    
    <form id="batch-form">
      <div class="form-row">
        <label class="label">How much new stock arrived? *</label>
        <div style="display:flex;gap:6px">
          <input class="input" type="number" step="any" name="qty" required value="1" autofocus>
          <select class="input" name="unit" style="width:120px">
            <option value="pack">${esc(p.pack_unit)}s</option>
            <option value="base">${esc(p.base_unit)}</option>
          </select>
        </div>
      </div>
      
      <hr style="border:0;border-top:1px solid var(--bd);margin:16px 0">
      <div style="font-size:12px;font-weight:600;color:var(--mu);margin-bottom:8px">NEW PRICES (effective from today)</div>
      
      <div class="form-grid">
        <div><label class="label">Cost Price / ${esc(p.base_unit)} (₹) *</label><input class="input" type="number" step="any" name="cost_price_base" required value="${current?current.cost_price_base:0}"></div>
        <div><label class="label">Sell Price / ${esc(p.base_unit)} (₹) *</label><input class="input" type="number" step="any" name="sell_price_base" required value="${current?current.sell_price_base:0}"></div>
      </div>
      <div class="form-grid">
        <div><label class="label">Sell Price / ${esc(p.pack_unit)} (₹) *</label><input class="input" type="number" step="any" name="sell_price_pack" required value="${current?current.sell_price_pack:0}"></div>
        <div></div>
      </div>
      
      <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:16px">
        <button type="button" class="btn btn-secondary" onclick="closeModal()">Cancel</button>
        <button class="btn btn-primary" id="bf-save">Save Batch</button>
      </div>
    </form>`, root => {
    root.querySelector('#batch-form').onsubmit = async e => {
      e.preventDefault();
      const fd = new FormData(e.target);
      const btn = root.querySelector('#bf-save'); btn.disabled = true; btn.textContent = 'Saving...';
      
      const qty = Number(fd.get('qty')) || 0;
      const isPack = fd.get('unit') === 'pack';
      const baseQty = isPack ? qty * Number(p.pack_size) : qty;
      const newStock = Number(p.stock) + baseQty;
      
      // 1. Update stock in products table
      const { error: stkErr } = await sb.from('seeds_products').update({ stock: newStock }).eq('id', p.id);
      if(stkErr){ toast(stkErr.message, 'error'); btn.disabled = false; btn.textContent = 'Save Batch'; return; }
      
      // 2. Check if a price already exists for today so we can add to the batch quantity
      const { data: existingPrice } = await sb.from('seeds_prices')
        .select('stock_added_base, stock_added_pack')
        .eq('product_id', p.id)
        .eq('effective_date', today)
        .maybeSingle();

      const prevBase = Number(existingPrice?.stock_added_base || 0);
      const prevPack = Number(existingPrice?.stock_added_pack || 0);

      const newBaseAdded = prevBase + (isPack ? 0 : qty);
      const newPackAdded = prevPack + (isPack ? qty : 0);

      // 3. Insert/Update price for today along with the batch size
      const { error: prErr } = await sb.from('seeds_prices').upsert({
        product_id: p.id,
        effective_date: today,
        sell_price_base: Number(fd.get('sell_price_base')) || 0,
        sell_price_pack: Number(fd.get('sell_price_pack')) || 0,
        cost_price_base: Number(fd.get('cost_price_base')) || 0,
        stock_added_base: newBaseAdded,
        stock_added_pack: newPackAdded
      }, { onConflict: 'product_id,effective_date' });
      
      if(prErr){ toast('Stock updated, but price failed: ' + prErr.message, 'error'); btn.disabled = false; btn.textContent = 'Save Batch'; return; }
      
      await syncDB();
      toast('Stock added and new prices saved', 'success');
      closeModal();
      route();
    };
  });
}

// 3. ADJUST: For corrections (damage, spoilage, miscounts) — only changes stock, NOT price
function openStockForm(p){
  openModal(`
    <h2>Adjust Stock — ${esc(p.name)}</h2>
    <p style="font-size:13px;color:var(--mu);margin-bottom:14px">Current: <b>${fmtNum(p.stock)} ${esc(p.base_unit)}</b></p>
    <form id="stock-form">
      <div class="form-grid">
        <div><label class="label">Action</label><select class="input" name="mode"><option value="add">Add (+)</option><option value="sub">Deduct (−)</option></select></div>
        <div><label class="label">Unit</label><select class="input" name="unit"><option value="base">${esc(p.base_unit)}</option><option value="pack">${esc(p.pack_unit)}</option></select></div>
      </div>
      <div class="form-row"><label class="label">Quantity *</label><input class="input" type="number" step="any" name="qty" required autofocus></div>
      <div style="display:flex;gap:8px;justify-content:flex-end">
        <button type="button" class="btn btn-secondary" onclick="closeModal()">Cancel</button>
        <button class="btn btn-primary" id="stf-save">Save Adjustment</button>
      </div>
    </form>`, root=>{
    root.querySelector('#stock-form').onsubmit = async e=>{
      e.preventDefault();
      const fd = new FormData(e.target);
      const qty = Number(fd.get('qty'))||0;
      if(qty<=0){ toast('Qty must be > 0','error'); return; }
      const isPack = fd.get('unit')==='pack';
      const baseQty = isPack ? qty*Number(p.pack_size) : qty;
      const delta = fd.get('mode')==='add' ? baseQty : -baseQty;
      const newStock = Number(p.stock) + delta;
      const btn = root.querySelector('#stf-save'); btn.disabled=true; btn.textContent='Saving...';
      const { error } = await sb.from('seeds_products').update({stock:newStock}).eq('id',p.id);
      if(error){ toast(error.message,'error'); btn.disabled=false; btn.textContent='Save'; return; }
      await syncDB(); toast('Stock adjusted','success'); closeModal(); route();
    };
  });
}

      const fd = new FormData(e.target);
      const btn = root.querySelector('#pf-save'); btn.disabled=true; btn.textContent='Saving...';
      const data = {
        name:fd.get('name').trim(),
        base_unit:fd.get('base_unit'),
        pack_unit:fd.get('pack_unit'),
        pack_size:Number(fd.get('pack_size'))||1,
        stock:Number(fd.get('stock'))||0,
        low_stock_alert:Number(fd.get('low_alert'))||0
      };
      let prodId;
      if(existing){
        const { error } = await sb.from('seeds_products').update(data).eq('id',existing.id);
        if(error){ toast(error.message,'error'); btn.disabled=false; btn.textContent='Update'; return; }
        prodId = existing.id;
      } else {
        const { data:ins, error } = await sb.from('seeds_products').insert(data).select().single();

          cost_price_base:Number(fd.get('cost_price_base'))||0
        }, { onConflict:'product_id,effective_date' });
        if(perr) toast('Product saved but price failed: '+perr.message,'error');
      }
      await syncDB(); toast(existing?'Updated':'Product added','success'); closeModal(); route();

}

/* ---------- REPORTS ---------- */
function renderReports(content){
  const today = todayStr();
  const firstOfMonth = new Date(new Date().getFullYear(), new Date().getMonth(), 1).toISOString().slice(0,10);
  content.innerHTML = `
    <div class="page-header">
      <div><h1>Reports</h1><p>Sales, profit and margin</p></div>
    </div>
    <div class="card" style="margin-bottom:16px">
      <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:end">
        <div><label class="label">From</label><input class="input" type="date" id="r-from" value="${firstOfMonth}" max="${today}"></div>
        <div><label class="label">To</label><input class="input" type="date" id="r-to" value="${today}" max="${today}"></div>
        <div style="display:flex;gap:6px">
          <button class="btn btn-secondary btn-sm" data-preset="today">Today</button>
          <button class="btn btn-secondary btn-sm" data-preset="week">This Week</button>
          <button class="btn btn-secondary btn-sm" data-preset="month">This Month</button>
          <button class="btn btn-secondary btn-sm" data-preset="year">This Year</button>
        </div>
      </div>
    </div>
    <div class="stats-grid" id="r-stats" style="grid-template-columns:repeat(auto-fit,minmax(160px,1fr))"></div>
    <div class="card" style="margin-bottom:16px">
      <h2 style="font-size:16px;font-weight:700;margin-bottom:12px">Invoice-wise Profit &amp; Margin</h2>
      <div class="table-wrap"><table>
        <thead><tr><th>Invoice</th><th>Customer</th><th>Date</th><th class="text-right">Revenue</th><th class="text-right">Cost</th><th class="text-right">Profit</th><th class="text-right">Margin</th></tr></thead>
        <tbody id="r-body"></tbody>
      </table></div>
    </div>
    <div class="card">
      <h2 style="font-size:16px;font-weight:700;margin-bottom:12px">Detailed Sales (Product-wise)</h2>
      <div class="table-wrap"><table>
        <thead><tr><th>Product</th><th>Date</th><th class="text-right">Qty</th><th class="text-right">Rate</th><th class="text-right">Total</th><th class="text-right">Profit</th></tr></thead>
        <tbody id="r-prod-body"></tbody>
      </table></div>
    </div>`;

  function load(){
    const from = $('#r-from').value, to = $('#r-to').value;
    if(!from || !to){ toast('Pick both dates','error'); return; }
    if(from > to){ toast('From cannot be after To','error'); return; }
    
    // Invoices and Items
    const invs = DB.invoices.filter(i=>i.invoice_date >= from && i.invoice_date <= to);
    const invsIds = invs.map(i=>i.id);
    const items = DB.invoice_items.filter(it=>invsIds.includes(it.invoice_id));

    // Supplier Bills (Purchases)
    const bills = DB.supplier_bills.filter(b => b.bill_date >= from && b.bill_date <= to);
    const totalPurchases = bills.reduce((s, b) => s + Number(b.total), 0);

    let cost = 0;
    items.forEach(it=>{
      cost += Number(it.qty) * Number(it.cost_price);
    });
    
    const totalRev = invs.reduce((s,i)=>s+Number(i.total),0);
    const profit = totalRev - cost;
    const margin = totalRev > 0 ? (profit/totalRev)*100 : 0;

    // Stats Cards
    $('#r-stats').innerHTML = `
      <div class="stat-card"><div class="stat-label">Total Sales</div><div class="stat-value green">${rs(totalRev)}</div><div class="stat-sub">${invs.length} invoices</div></div>
      <div class="stat-card"><div class="stat-label">Total Purchases</div><div class="stat-value blue">${rs(totalPurchases)}</div><div class="stat-sub">${bills.length} bills</div></div>
      <div class="stat-card"><div class="stat-label">Cost of Goods Sold</div><div class="stat-value">${rs(cost)}</div></div>
      <div class="stat-card"><div class="stat-label">Profit</div><div class="stat-value ${profit>=0?'green':'red'}">${rs(profit)}</div></div>
      <div class="stat-card"><div class="stat-label">Margin</div><div class="stat-value ${margin>=0?'green':'red'}">${margin.toFixed(1)}%</div></div>`;

    // Invoice-wise
    const rows = invs.map(inv=>{
      const c = DB.customers.find(x=>x.id===inv.customer_id);
      const its = items.filter(it=>it.invoice_id===inv.id);
      const ic = its.reduce((s,it)=>s+Number(it.qty)*Number(it.cost_price),0);
      const p = Number(inv.total) - ic;
      const m = Number(inv.total) > 0 ? (p/Number(inv.total))*100 : 0;
      return { inv, cust:c, cost:ic, profit:p, margin:m };
    }).sort((a,b)=>b.inv.invoice_date.localeCompare(a.inv.invoice_date));
    
    $('#r-body').innerHTML = rows.length===0?'<tr><td colspan="7" class="empty">No invoices</td></tr>'
      :rows.map(r=>`<tr>
        <td style="font-weight:500"><a href="#/invoice/${r.inv.id}">${esc(r.inv.invoice_no)}</a></td>
        <td>${esc(r.cust?.name||'Walk-in')}</td>
        <td>${fmtDate(r.inv.invoice_date)}</td>
        <td class="text-right">${rs(r.inv.total)}</td>
        <td class="text-right" style="color:var(--mu)">${rs(r.cost)}</td>
        <td class="text-right" style="font-weight:600;color:${r.profit>=0?'var(--gd)':'var(--r)'}">${rs(r.profit)}</td>
        <td class="text-right" style="color:${r.margin>=0?'var(--gd)':'var(--r)'}">${r.margin.toFixed(1)}%</td>
      </tr>`).join('');

    // Detailed Sales (Product-wise, showing each date and rate used)
    const detailedSales = [];
    invs.forEach(inv => {
       const invItems = items.filter(it => it.invoice_id === inv.id);
       invItems.forEach(it => {
          const itCost = Number(it.qty) * Number(it.cost_price);
          const itProfit = Number(it.total) - itCost;
          detailedSales.push({
             product: it.product_name,
             date: inv.invoice_date,
             qty: fmtNum(it.qty) + ' ' + it.unit,
             rate: rs(it.sell_price),
             total: Number(it.total),
             profit: itProfit
          });
       });
    });
    
    // Sort by product name, then by date
    detailedSales.sort((a,b) => a.product.localeCompare(b.product) || a.date.localeCompare(b.date));

    $('#r-prod-body').innerHTML = detailedSales.length===0?'<tr><td colspan="6" class="empty">No data</td></tr>'
      :detailedSales.map(d=>`<tr>
        <td style="font-weight:500">${esc(d.product)}</td>
        <td>${fmtDate(d.date)}</td>
        <td class="text-right">${d.qty}</td>
        <td class="text-right">${d.rate}</td>
        <td class="text-right">${rs(d.total)}</td>
        <td class="text-right" style="color:${d.profit>=0?'var(--gd)':'var(--r)'}">${rs(d.profit)}</td>
      </tr>`).join('');
  }

  $$('[data-preset]').forEach(b=>b.onclick=()=>{
    const p = b.dataset.preset;
    const to = todayStr();
    let from = todayStr();
    if(p==='week'){ const d=new Date(); const day=d.getDay()||7; const mon=new Date(d); mon.setDate(d.getDate()-day+1); from = mon.toISOString().slice(0,10); }
    else if(p==='month') from = firstOfMonth;
    else if(p==='year') from = new Date().getFullYear()+'-01-01';
    $('#r-from').value = from; $('#r-to').value = to;
    load();
  });
  $('#r-from').onchange = load;
  $('#r-to').onchange = load;
  load();
}

/* ---------- ROUTER ---------- */
async function route(){
  const hash = location.hash || '#/';
  if(!SESSION){ renderLogin(); return; }
  renderLayout();
  const content = $('#content');
  if(!content) return;
  try{
    if(hash==='#/' || hash==='') renderDashboard(content);
    else if(hash==='#/customers') renderCustomers(content);
    else if(hash.startsWith('#/customer/')) renderCustomerProfile(content, hash.slice(11));
    else if(hash==='#/invoices') renderInvoices(content);
    else if(hash==='#/invoice/new') renderNewInvoice(content);
    else if(hash.startsWith('#/invoice/')) renderInvoiceView(content, hash.slice(10));
    else if(hash==='#/products') renderProducts(content);
    else if(hash==='#/suppliers') renderSuppliers(content);
    else if(hash.startsWith('#/supplier/')) renderSupplierProfile(content, hash.slice(11));
    else if(hash==='#/reports') renderReports(content);
    else if(hash==='#/profile') renderProfile(content);
    else renderDashboard(content);
  }catch(e){
    console.error(e);
    content.innerHTML = '<div class="card" style="color:var(--r)">Error: '+esc(e.message)+'</div>';
  }
}
window.addEventListener('hashchange', route);

/* ---------- REPORTS ---------- */
function renderReports(content){
  const today = todayStr();
  const firstOfMonth = new Date(new Date().getFullYear(), new Date().getMonth(), 1).toISOString().slice(0,10);
  content.innerHTML = `
    <div class="page-header">
      <div><h1>Reports</h1><p>Sales, profit and margin</p></div>
    </div>
    <div class="card" style="margin-bottom:16px">
      <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:end">
        <div><label class="label">From</label><input class="input" type="date" id="r-from" value="${firstOfMonth}" max="${today}"></div>
        <div><label class="label">To</label><input class="input" type="date" id="r-to" value="${today}" max="${today}"></div>
        <div style="display:flex;gap:6px">
          <button class="btn btn-secondary btn-sm" data-preset="today">Today</button>
          <button class="btn btn-secondary btn-sm" data-preset="week">This Week</button>
          <button class="btn btn-secondary btn-sm" data-preset="month">This Month</button>
          <button class="btn btn-secondary btn-sm" data-preset="year">This Year</button>
        </div>
      </div>
    </div>
    <div class="stats-grid" id="r-stats" style="grid-template-columns:repeat(auto-fit,minmax(160px,1fr))"></div>
    <div class="card" style="margin-bottom:16px">
      <h2 style="font-size:16px;font-weight:700;margin-bottom:12px">Invoice-wise Profit &amp; Margin</h2>
      <div class="table-wrap"><table>
        <thead><tr><th>Invoice</th><th>Customer</th><th>Date</th><th class="text-right">Revenue</th><th class="text-right">Cost</th><th class="text-right">Profit</th><th class="text-right">Margin</th></tr></thead>
        <tbody id="r-body"></tbody>
      </table></div>
    </div>
    <div class="card">
      <h2 style="font-size:16px;font-weight:700;margin-bottom:12px">Detailed Sales (Product-wise)</h2>
      <div class="table-wrap"><table>
        <thead><tr><th>Product</th><th>Date</th><th class="text-right">Qty</th><th class="text-right">Rate</th><th class="text-right">Total</th><th class="text-right">Profit</th></tr></thead>
        <tbody id="r-prod-body"></tbody>
      </table></div>
    </div>`;

  function load(){
    const from = $('#r-from').value, to = $('#r-to').value;
    if(!from || !to){ toast('Pick both dates','error'); return; }
    if(from > to){ toast('From cannot be after To','error'); return; }
    
    const invs = DB.invoices.filter(i=>i.invoice_date >= from && i.invoice_date <= to);
    const invsIds = invs.map(i=>i.id);
    const items = DB.invoice_items.filter(it=>invsIds.includes(it.invoice_id));

    const bills = DB.supplier_bills.filter(b => b.bill_date >= from && b.bill_date <= to);
    const totalPurchases = bills.reduce((s, b) => s + Number(b.total), 0);

    let cost = 0;
    items.forEach(it=>{
      cost += Number(it.qty) * Number(it.cost_price);
    });
    
    const totalRev = invs.reduce((s,i)=>s+Number(i.total),0);
    const profit = totalRev - cost;
    const margin = totalRev > 0 ? (profit/totalRev)*100 : 0;

    $('#r-stats').innerHTML = `
      <div class="stat-card"><div class="stat-label">Total Sales</div><div class="stat-value green">${rs(totalRev)}</div><div class="stat-sub">${invs.length} invoices</div></div>
      <div class="stat-card"><div class="stat-label">Total Purchases</div><div class="stat-value blue">${rs(totalPurchases)}</div><div class="stat-sub">${bills.length} bills</div></div>
      <div class="stat-card"><div class="stat-label">Cost of Goods Sold</div><div class="stat-value">${rs(cost)}</div></div>
      <div class="stat-card"><div class="stat-label">Profit</div><div class="stat-value ${profit>=0?'green':'red'}">${rs(profit)}</div></div>
      <div class="stat-card"><div class="stat-label">Margin</div><div class="stat-value ${margin>=0?'green':'red'}">${margin.toFixed(1)}%</div></div>`;

    const rows = invs.map(inv=>{
      const c = DB.customers.find(x=>x.id===inv.customer_id);
      const its = items.filter(it=>it.invoice_id===inv.id);
      const ic = its.reduce((s,it)=>s+Number(it.qty)*Number(it.cost_price),0);
      const p = Number(inv.total) - ic;
      const m = Number(inv.total) > 0 ? (p/Number(inv.total))*100 : 0;
      return { inv, cust:c, cost:ic, profit:p, margin:m };
    }).sort((a,b)=>b.inv.invoice_date.localeCompare(a.inv.invoice_date));
    
    $('#r-body').innerHTML = rows.length===0?'<tr><td colspan="7" class="empty">No invoices</td></tr>'
      :rows.map(r=>`<tr>
        <td style="font-weight:500"><a href="#/invoice/${r.inv.id}">${esc(r.inv.invoice_no)}</a></td>
        <td>${esc(r.cust?.name||'Walk-in')}</td>
        <td>${fmtDate(r.inv.invoice_date)}</td>
        <td class="text-right">${rs(r.inv.total)}</td>
        <td class="text-right" style="color:var(--mu)">${rs(r.cost)}</td>
        <td class="text-right" style="font-weight:600;color:${r.profit>=0?'var(--gd)':'var(--r)'}">${rs(r.profit)}</td>
        <td class="text-right" style="color:${r.margin>=0?'var(--gd)':'var(--r)'}">${r.margin.toFixed(1)}%</td>
      </tr>`).join('');

    const detailedSales = [];
    invs.forEach(inv => {
       const invItems = items.filter(it => it.invoice_id === inv.id);
       invItems.forEach(it => {
          const itCost = Number(it.qty) * Number(it.cost_price);
          const itProfit = Number(it.total) - itCost;
          detailedSales.push({
             product: it.product_name,
             date: inv.invoice_date,
             qty: fmtNum(it.qty) + ' ' + it.unit,
             rate: rs(it.sell_price),
             total: Number(it.total),
             profit: itProfit
          });
       });
    });
    
    detailedSales.sort((a,b) => a.product.localeCompare(b.product) || a.date.localeCompare(b.date));

    $('#r-prod-body').innerHTML = detailedSales.length===0?'<tr><td colspan="6" class="empty">No data</td></tr>'
      :detailedSales.map(d=>`<tr>
        <td style="font-weight:500">${esc(d.product)}</td>
        <td>${fmtDate(d.date)}</td>
        <td class="text-right">${d.qty}</td>
        <td class="text-right">${d.rate}</td>
        <td class="text-right">${rs(d.total)}</td>
        <td class="text-right" style="color:${d.profit>=0?'var(--gd)':'var(--r)'}">${rs(d.profit)}</td>
      </tr>`).join('');
  }

  $$('[data-preset]').forEach(b=>b.onclick=()=>{
    const p = b.dataset.preset;
    const to = todayStr();
    let from = todayStr();
    if(p==='week'){ const d=new Date(); const day=d.getDay()||7; const mon=new Date(d); mon.setDate(d.getDate()-day+1); from = mon.toISOString().slice(0,10); }
    else if(p==='month') from = firstOfMonth;
    else if(p==='year') from = new Date().getFullYear()+'-01-01';
    $('#r-from').value = from; $('#r-to').value = to;
    load();
  });
  $('#r-from').onchange = load;
  $('#r-to').onchange = load;
  load();
}

/* ---------- ROUTER ---------- */
async function route(){
  const hash = location.hash || '#/';
  if(!SESSION){ renderLogin(); return; }
  renderLayout();
  const content = $('#content');
  if(!content) return;
  try{
    if(hash==='#/' || hash==='') renderDashboard(content);
    else if(hash==='#/customers') renderCustomers(content);
    else if(hash.startsWith('#/customer/')) renderCustomerProfile(content, hash.slice(11));
    else if(hash==='#/invoices') renderInvoices(content);
    else if(hash==='#/invoice/new') renderNewInvoice(content);
    else if(hash.startsWith('#/invoice/')) renderInvoiceView(content, hash.slice(10));
    else if(hash==='#/products') renderProducts(content);
    else if(hash==='#/suppliers') renderSuppliers(content);
    else if(hash.startsWith('#/supplier/')) renderSupplierProfile(content, hash.slice(11));
    else if(hash==='#/reports') renderReports(content);
    else if(hash==='#/profile') renderProfile(content);
    else renderDashboard(content);
  }catch(e){
    console.error(e);
    content.innerHTML = '<div class="card" style="color:var(--r)">Error: '+esc(e.message)+'</div>';
  }
}
window.addEventListener('hashchange', route);

function renderInvoices(content){
  content.innerHTML = `
    <div class="page-header">
      <div><h1>Invoices</h1><p>All sales invoices</p></div>
      <div class="page-actions"><a href="#/invoice/new" class="btn btn-primary">+ New Invoice</a></div>

      <thead><tr><th>Invoice</th><th>Customer</th><th>Date</th><th class="text-right">Total</th><th class="text-right">Paid</th><th class="text-right">Due</th><th></th></tr></thead>
      <tbody id="inv-body"></tbody>
    </table></div></div>`;

  function renderTable(){
    const q = ($('#inv-search').value||'').toLowerCase();
    const arr = DB.invoices.filter(i=>{
      const c = DB.customers.find(x=>x.id===i.customer_id);
      const hay = (i.invoice_no+' '+(c?.name||'')+' '+(c?.phone||'')).toLowerCase();
      return !q || hay.includes(q);
    });
    const body = $('#inv-body');
    if(arr.length===0){ body.innerHTML='<tr><td colspan="7" class="empty">No invoices</td></tr>'; return; }
    body.innerHTML = arr.map(i=>{
      const c = DB.customers.find(x=>x.id===i.customer_id);
      return `<tr>
        <td style="font-weight:500"><a href="#/invoice/${i.id}">${esc(i.invoice_no)}</a></td>
        <td>${esc(c?.name||'Walk-in')}</td>
        <td>${fmtDate(i.invoice_date)}</td>
        <td class="text-right">${rs(i.total)}</td>
        <td class="text-right" style="color:var(--gd)">${rs(i.paid)}</td>
        <td class="text-right" style="color:${Number(i.due)>0?'var(--r)':'var(--mu)'};font-weight:${Number(i.due)>0?'600':'400'}">${rs(i.due)}</td>
        <td class="text-right"><button class="btn btn-danger btn-sm" data-del="${i.id}">Del</button></td>
      </tr>`;
    }).join('');
    
    // Delete Invoice with Custom Modal & Stock Restore
    $$('[data-del]',body).forEach(b=>b.onclick=()=>{
      const inv = DB.invoices.find(x=>x.id===b.dataset.del);
      openModal(`
        <h2>Delete Invoice?</h2>
        <p style="font-size:14px;color:var(--mu);margin-bottom:20px">Are you sure you want to delete invoice <b>${esc(inv.invoice_no)}</b>? The stock will be restored to inventory.</p>
        <div style="display:flex;gap:8px;justify-content:flex-end">
          <button type="button" class="btn btn-secondary" onclick="closeModal()">Cancel</button>
          <button class="btn btn-danger" id="del-inv-btn">Delete Invoice</button>
        </div>
      `, root => {
        root.querySelector('#del-inv-btn').onclick = async () => {
          const btn = root.querySelector('#del-inv-btn'); btn.disabled=true; btn.textContent='Deleting...';
          
          const items = DB.invoice_items.filter(it=>it.invoice_id===inv.id);
          // Restore stock
          for(const it of items){
            if(!it.product_id) continue;
            const p = DB.products.find(x=>x.id===it.product_id);
            if(p){
              await sb.from('seeds_products').update({stock:Number(p.stock)+Number(it.base_qty)}).eq('id',p.id);
            }
          }
          await sb.from('seeds_invoices').delete().eq('id',inv.id);
          await syncDB(); toast('Deleted and stock restored','success'); closeModal(); route();
        };
      });
    });
  }
  $('#inv-search').oninput = renderTable;
  renderTable();
}

/* ---------- NEW INVOICE ---------- */
function renderNewInvoice(content){
  let lines = []; // {product_id, product_name, unit, qty, base_qty, pack_size, sell_price, cost_price, total}
  let selectedCustomerId = null;

  content.innerHTML = `
    <div class="page-header">
      <div><h1>New Invoice</h1></div>
      <div class="page-actions"><a href="#/invoices" class="btn btn-secondary">Cancel</a></div>
    </div>
    <div class="card" style="margin-bottom:16px">
      <div class="form-grid">
        <div><label class="label">Invoice Date *</label><input class="input" type="date" id="inv-date" value="${todayStr()}" max="${todayStr()}"></div>
        <div><label class="label">Customer</label>
          <div style="display:flex;gap:6px">
            <select class="input" id="inv-customer"><option value="">— Walk-in —</option>
              ${DB.customers.map(c=>`<option value="${c.id}">${esc(c.name)}${c.phone?' · '+esc(c.phone):''}</option>`).join('')}
            </select>
            <button type="button" class="btn btn-secondary" id="btn-new-cust" style="padding:8px 12px">+</button>
          </div>
        </div>
      </div>
    </div>
    <div class="card" style="margin-bottom:16px">
      <label class="label">Add Item</label>
      <div style="display:flex;gap:6px;margin-bottom:12px">
        <select class="input" id="add-prod-select">
          <option value="">— Select product —</option>
          ${DB.products.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}
        </select>
        <button type="button" class="btn btn-primary" id="btn-add-line">Add</button>
      </div>
      <div id="lines-box"></div>
    </div>
    <div class="card" style="margin-bottom:16px">
      <div class="form-grid">
        <div><label class="label">Discount (₹)</label><input class="input" type="number" step="any" id="inv-disc" value="0"></div>
        <div><label class="label">Paid Now (₹)</label><input class="input" type="number" step="any" id="inv-paid" value="0"></div>
      </div>
      <div class="form-row"><label class="label">Notes</label><input class="input" id="inv-notes"></div>
      <div id="summary" style="background:var(--bg);padding:14px;border-radius:10px;font-size:14px"></div>
    </div>
    <div style="display:flex;gap:8px;justify-content:flex-end">
      <button class="btn btn-secondary" id="btn-save" style="padding:12px 24px">Save Invoice</button>
    </div>`;

  function renderLines(){
    const box = $('#lines-box');
    if(lines.length===0){ box.innerHTML='<div class="empty" style="padding:20px">No items added yet</div>'; updateSummary(); return; }
    box.innerHTML = `<div class="table-wrap"><table class="line-table">
      <thead><tr><th>Item</th><th>Unit</th><th>Qty</th><th>Price</th><th class="text-right">Total</th><th></th></tr></thead>
      <tbody>${lines.map((l,i)=>`
        <tr>
          <td>${esc(l.product_name)}</td>
          <td><select class="input" data-i="${i}" data-f="unit">
            <option value="base" ${l.unit==='base'?'selected':''}>${esc(l.base_unit)}</option>
            <option value="pack" ${l.unit==='pack'?'selected':''}>${esc(l.pack_unit)}</option>
          </select></td>
          <td><input class="input" type="number" step="any" data-i="${i}" data-f="qty" value="${l.qty}" style="width:90px"></td>
          <td><input class="input" type="number" step="any" data-i="${i}" data-f="sell_price" value="${l.sell_price}" style="width:110px"></td>
          <td class="text-right" style="font-weight:600">${rs(l.total)}</td>
          <td class="text-right"><button class="btn btn-danger btn-sm" data-del="${i}">×</button></td>
        </tr>`).join('')}</tbody>
    </table></div>`;
    $$('input[data-i]',box).forEach(inp=>inp.oninput=e=>{
      const i=+e.target.dataset.i, f=e.target.dataset.f;
      lines[i][f] = Number(e.target.value)||0;
      recalcLine(i);
      renderLines();
    });
    $$('select[data-i]',box).forEach(sel=>sel.onchange=e=>{
      const i=+e.target.dataset.i;
      lines[i].unit = e.target.value;
      const pr = resolvePrice(lines[i].product_id, $('#inv-date').value);
      if(pr){
        lines[i].sell_price = lines[i].unit==='pack' ? Number(pr.sell_price_pack) : Number(pr.sell_price_base);
        lines[i].cost_price = lines[i].unit==='pack' ? Number(pr.cost_price_base)*Number(lines[i].pack_size) : Number(pr.cost_price_base);
      }
      recalcLine(i);
      renderLines();
    });
    $$('[data-del]',box).forEach(b=>b.onclick=()=>{ lines.splice(+b.dataset.del,1); renderLines(); });
    updateSummary();
  }
  function recalcLine(i){
    const l = lines[i];
    l.base_qty = l.unit==='pack' ? Number(l.qty)*Number(l.pack_size) : Number(l.qty);
    l.total = Number(l.qty)*Number(l.sell_price);
  }
  function updateSummary(){
    const subtotal = lines.reduce((s,l)=>s+l.total,0);
    const disc = Number($('#inv-disc').value)||0;
    const total = Math.max(0, subtotal-disc);
    const paid = Number($('#inv-paid').value)||0;
    const due = Math.max(0, total-paid);
    $('#summary').innerHTML = `<div style="display:flex;justify-content:space-between;margin-bottom:4px"><span>Subtotal</span><span>${rs(subtotal)}</span></div>
      ${disc>0?`<div style="display:flex;justify-content:space-between;margin-bottom:4px"><span>Discount</span><span>−${rs(disc)}</span></div>`:''}
      <div style="display:flex;justify-content:space-between;font-weight:700;font-size:16px;border-top:1px solid var(--bd);padding-top:6px;margin-top:6px"><span>Total</span><span>${rs(total)}</span></div>
      <div style="display:flex;justify-content:space-between;margin-top:4px"><span>Paid</span><span>${rs(paid)}</span></div>
      <div style="display:flex;justify-content:space-between;color:${due>0?'var(--r)':'var(--mu)'};font-weight:600"><span>Due</span><span>${rs(due)}</span></div>`;
  }
  $('#inv-disc').oninput = updateSummary;
  $('#inv-paid').oninput = updateSummary;

  $('#btn-add-line').onclick = ()=>{
    const pid = $('#add-prod-select').value;
    if(!pid){ toast('Select a product','error'); return; }
    const p = DB.products.find(x=>x.id===pid);
    if(!p) return;
    const invDate = $('#inv-date').value;
    const pr = resolvePrice(p.id, invDate);
    if(!pr){ toast('No price set for this product. Add a price first.','error'); return; }
    const existing = lines.findIndex(l=>l.product_id===p.id && l.unit==='base');
    if(existing>=0){
      lines[existing].qty = Number(lines[existing].qty) + 1;
      recalcLine(existing);
      renderLines();
      return;
    }
    lines.push({
      product_id:p.id,
      product_name:p.name,
      base_unit:p.base_unit,
      pack_unit:p.pack_unit,
      pack_size:Number(p.pack_size),
      unit:'base',
      qty:1,
      base_qty:1,
      sell_price:Number(pr.sell_price_base),
      cost_price:Number(pr.cost_price_base),
      total:Number(pr.sell_price_base)
    });
    $('#add-prod-select').value = '';
    renderLines();
  };

  $('#btn-new-cust').onclick = ()=>{
    openModal(`
      <h2>Quick Add Customer</h2>
      <form id="quick-cust">
        <div class="form-row"><label class="label">Name *</label><input class="input" name="name" required autofocus></div>
        <div class="form-row"><label class="label">Phone</label><input class="input" name="phone"></div>
        <div style="display:flex;gap:8px;justify-content:flex-end">
          <button type="button" class="btn btn-secondary" onclick="closeModal()">Cancel</button>
          <button class="btn btn-primary" id="qcs">Save & Select</button>
        </div>
      </form>`, root=>{
      root.querySelector('#quick-cust').onsubmit = async e=>{
        e.preventDefault();
        const fd = new FormData(e.target);
        const btn = root.querySelector('#qcs'); btn.disabled=true; btn.textContent='Saving...';
        const { data, error } = await sb.from('seeds_customers').insert({name:fd.get('name').trim(), phone:fd.get('phone').trim()}).select().single();
        if(error){ toast(error.message,'error'); btn.disabled=false; btn.textContent='Save & Select'; return; }
        await syncDB();
        selectedCustomerId = data.id;
        const sel = $('#inv-customer');
        const opt = document.createElement('option');
        opt.value = data.id; opt.textContent = data.name + (data.phone?' · '+data.phone:'');
        sel.appendChild(opt); sel.value = data.id;
        toast('Customer added','success'); closeModal();
      };
    });
  };

  $('#btn-save').onclick = async ()=>{
    if(lines.length===0){ toast('Add at least one item','error'); return; }
    const invDate = $('#inv-date').value;
    if(!invDate){ toast('Pick invoice date','error'); return; }
    if(invDate > todayStr()){ toast('Future dates not allowed','error'); return; }
    for(const l of lines){
      const p = DB.products.find(x=>x.id===l.product_id);
      if(p && Number(p.stock) < Number(l.base_qty)){
        toast('Not enough stock: '+p.name,'error'); return;
      }
    }
    const btn = $('#btn-save'); btn.disabled=true; btn.textContent='Saving...';

    const subtotal = lines.reduce((s,l)=>s+l.total,0);
    const disc = Number($('#inv-disc').value)||0;
    const total = Math.max(0, subtotal-disc);
    const paid = Number($('#inv-paid').value)||0;
    const due = Math.max(0, total-paid);
    const custId = $('#inv-customer').value || null;
    const notes = $('#inv-notes').value;

    let maxN = 0;
    DB.invoices.forEach(inv=>{ const m = String(inv.invoice_no).match(/(\d+)/); if(m) maxN = Math.max(maxN, parseInt(m[1])); });
    const invoice_no = 'INV-' + String(maxN+1).padStart(4,'0');

    const { data:invData, error:invErr } = await sb.from('seeds_invoices').insert({
      invoice_no, customer_id:custId, invoice_date:invDate,
      subtotal, discount:disc, total, paid, due, notes
    }).select().single();
    if(invErr){ toast(invErr.message,'error'); btn.disabled=false; btn.textContent='Save Invoice'; return; }

    const itemsData = lines.map(l=>({
      invoice_id:invData.id, product_id:l.product_id, product_name:l.product_name,
      unit:l.unit==='pack'?l.pack_unit:l.base_unit,
      qty:l.qty, pack_size:l.pack_size, base_qty:l.base_qty,
      sell_price:l.sell_price, cost_price:l.cost_price, total:l.total
    }));
    const { error:itemErr } = await sb.from('seeds_invoice_items').insert(itemsData);
    if(itemErr){ toast('Items failed: '+itemErr.message,'error'); await sb.from('seeds_invoices').delete().eq('id',invData.id); btn.disabled=false; btn.textContent='Save Invoice'; return; }

    for(const l of lines){
      const p = DB.products.find(x=>x.id===l.product_id);
      if(p) await sb.from('seeds_products').update({stock:Number(p.stock)-Number(l.base_qty)}).eq('id',p.id);
    }

    await syncDB();
    toast('Invoice saved','success');
    location.hash = '#/invoice/'+invData.id;
  };

  renderLines();
}

/* ---------- INVOICE VIEW ---------- */
function renderInvoiceView(content, id){
  const inv = DB.invoices.find(x=>x.id===id);
  if(!inv){ content.innerHTML='<div class="empty">Invoice not found</div>'; return; }
  const items = DB.invoice_items.filter(it=>it.invoice_id===id);
  const cust = DB.customers.find(c=>c.id===inv.customer_id);

  content.innerHTML = `
    <a href="#/invoices" style="color:var(--mu);font-size:13px">← Back</a>
    <div class="page-header" style="margin-top:12px">
      <div><h1>Invoice ${esc(inv.invoice_no)}</h1><p>${fmtDate(inv.invoice_date)}</p></div>
      <div class="page-actions">
        <button class="btn btn-secondary" id="btn-print">Print</button>
        <button class="btn btn-primary" id="btn-pdf">Download PDF</button>
        <button class="btn btn-primary" id="btn-share" style="background:#25D366">WhatsApp Share</button>
      </div>
    </div>
    <div class="card" id="print-area" style="max-width:760px;margin:0 auto">
      <div style="display:flex;justify-content:space-between;gap:20px;border-bottom:2px solid var(--g);padding-bottom:16px;margin-bottom:16px">
        <div>
          <div style="font-size:20px;font-weight:700;color:var(--gd)">${esc(SETTINGS.shop_name||'Seed Shop')}</div>
          <div style="font-size:12px;color:var(--mu);margin-top:4px">${esc(SETTINGS.owner_name||'')}</div>
          <div style="font-size:12px;color:var(--mu)">${esc(SETTINGS.address||'')}</div>
          ${SETTINGS.phone?`<div style="font-size:12px;color:var(--mu)">Ph: ${esc(SETTINGS.phone)}</div>`:''}
          ${SETTINGS.license?`<div style="font-size:12px;color:var(--mu)">License: ${esc(SETTINGS.license)}</div>`:''}
        </div>
        <div style="text-align:right">
          <div style="font-size:16px;font-weight:700">${esc(inv.invoice_no)}</div>
          <div style="font-size:12px;color:var(--mu)">${fmtDate(inv.invoice_date)}</div>
        </div>
      </div>
      <div style="margin-bottom:16px">
        <div style="font-size:11px;color:var(--mu);text-transform:uppercase;font-weight:600">Bill to</div>
        <div style="font-weight:600;margin-top:2px">${esc(cust?.name||'Walk-in Customer')}</div>
        ${cust?.phone?`<div style="font-size:12px;color:var(--mu)">${esc(cust.phone)}</div>`:''}
      </div>
      <table style="margin-bottom:16px">
        <thead><tr><th>Item</th><th>Unit</th><th class="text-right">Qty</th><th class="text-right">Rate</th><th class="text-right">Amount</th></tr></thead>
        <tbody>${items.map(it=>`<tr>
          <td>${esc(it.product_name)}</td>
          <td>${esc(it.unit)}</td>
          <td class="text-right">${fmtNum(it.qty)}</td>
          <td class="text-right">${rs(it.sell_price)}</td>
          <td class="text-right">${rs(it.total)}</td>
        </tr>`).join('')}</tbody>
      </table>
      <div style="display:flex;justify-content:flex-end">
        <div style="min-width:220px">
          <div style="display:flex;justify-content:space-between;padding:4px 0;font-size:13px"><span>Subtotal</span><span>${rs(inv.subtotal)}</span></div>
          ${Number(inv.discount)>0?`<div style="display:flex;justify-content:space-between;padding:4px 0;font-size:13px"><span>Discount</span><span>−${rs(inv.discount)}</span></div>`:''}
          <div style="display:flex;justify-content:space-between;padding:6px 0;font-size:15px;font-weight:700;border-top:1px solid var(--bd);margin-top:4px"><span>Total</span><span>${rs(inv.total)}</span></div>
          <div style="display:flex;justify-content:space-between;padding:4px 0;font-size:13px"><span>Paid</span><span>${rs(inv.paid)}</span></div>
          <div style="display:flex;justify-content:space-between;padding:4px 0;font-size:13px;color:${Number(inv.due)>0?'var(--r)':'var(--mu)'};font-weight:600"><span>Due</span><span>${rs(inv.due)}</span></div>
        </div>
      </div>
      <div style="text-align:center;font-size:11px;color:var(--mu);margin-top:24px;padding-top:12px;border-top:1px solid var(--bd)">Thank you!</div>
    </div>`;

  $('#btn-print').onclick = ()=>window.print();
  $('#btn-pdf').onclick = ()=>downloadInvoicePDF(inv, items, cust);
  $('#btn-share').onclick = ()=>shareInvoicePDF(inv, items, cust);
}
</script>

<style>
/* Hide old layout */
.sidebar, .mobile-nav, .mobile-header { display: none !important; }

/* Adjust main content to make room for pills */
.layout { display: block !important; }
.main { padding: 40px 20px 120px 120px !important; max-width: 1200px; width: 100%; margin: 0 auto; }

/* Left Vertical Pill */
.vertical-pill {
  position: fixed; left: 20px; top: 50%; transform: translateY(-50%);
  background: var(--sf); border-radius: 40px; padding: 12px 0;
  box-shadow: 0 4px 20px rgba(0,0,0,0.08);

}

/* Bottom Horizontal Pill */
.horizontal-pill {

  box-shadow: 0 4px 20px rgba(0,0,0,0.08);
  display: flex; align-items: center; gap: 8px; height: 64px; z-index: 100;

}

/* Pill Links & Buttons */
.pill-link {
  position: relative; width: 48px; height: 48px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  color: var(--mu); font-size: 20px; text-decoration: none; transition: 0.2s;

}
.pill-link:hover { background: var(--bg); color: var(--tx); }
.pill-link.active { background: var(--gl); color: var(--gd); }

/* Tooltips */
.pill-tooltip {
  position: absolute; background: #1e293b; color: #fff;
  padding: 6px 12px; border-radius: 8px; font-size: 12px; font-weight: 500;
  white-space: nowrap; pointer-events: none; opacity: 0; visibility: hidden; transition: 0.2s; z-index: 101;
  box-shadow: 0 4px 10px rgba(0,0,0,0.15);
}

/* Tooltip Positions */
.vertical-pill .pill-link .pill-tooltip { left: 60px; top: 50%; transform: translateY(-50%) translateX(-10px); }
.vertical-pill .pill-link:hover .pill-tooltip { opacity: 1; visibility: visible; transform: translateY(-50%) translateX(0); }

.horizontal-pill .pill-link .pill-tooltip { bottom: 60px; left: 50%; transform: translateX(-50%) translateY(10px); }

/* Mobile Adjustments */
@media(max-width: 768px) {
  .vertical-pill { left: 10px; padding: 8px 0; }

}

<script>
(function() {
  // Override the original renderLayout function
  window.renderLayout = function() {
    const hash = location.hash || '#/';
    
    // Primary Navigation (Left Vertical Pill)
    const primaryNAV = [
      ['#/', '📊', 'Dashboard'],
      ['#/customers', '👥', 'Customers'],
      ['#/invoices', '📄', 'Invoices'],
      ['#/reports', '📈', 'Reports']
    ];
    
    // Secondary Navigation (Bottom Horizontal Pill)
    const secondaryNAV = [
      ['#/products', '📦', 'Products'],
      ['#/suppliers', '🚚', 'Suppliers'],
      ['#/profile', '⚙️', 'Shop Profile']
    ];

    const vnavHTML = primaryNAV.map(([h, i, l]) => {
      const a = hash === h || (h !== '#/' && hash.startsWith(h)) ? 'active' : '';
      return `<a href="${h}" class="pill-link ${a}"><span>${i}</span><span class="pill-tooltip">${l}</span></a>`;
    }).join('');

    const hnavHTML = secondaryNAV.map(([h, i, l]) => {
      const a = hash === h || (h !== '#/' && hash.startsWith(h)) ? 'active' : '';
      return `<a href="${h}" class="pill-link ${a}"><span>${i}</span><span class="pill-tooltip">${l}</span></a>`;
    }).join('');

    document.getElementById('app').innerHTML = `
      <div class="layout">
        <!-- Left Vertical Pill -->
        <nav class="vertical-pill">
          ${vnavHTML}
        </nav>

        <!-- Main Content Area -->
        <main id="content" class="main"></main>
        
        <!-- Bottom Horizontal Pill -->
        <nav class="horizontal-pill">
          ${hnavHTML}
          <div style="width:1px; height:24px; background:var(--bd); margin:0 4px;"></div>
          <button id="btn-logout" class="pill-link" style="color:var(--r)">
            <span>↪</span>
            <span class="pill-tooltip">Sign out</span>
          </button>
        </nav>
      </div>`;
      
    document.getElementById('btn-logout').onclick = logout;
  };
})();
</script>
